<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Instalar · Kaya Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b89021">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Kaya">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Red+Hat+Display:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#ffffff; --surface:#faf8f4; --surface2:#f4e8c8; --border:#e0cfa0;
         --accent:#b89021; --accent2:#8b6914; --text:#1a1a1a; --muted:#9a8a6a; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text); font-family:'Red Hat Display',sans-serif;
        font-size:14px; line-height:1.5; min-height:100vh; display:flex;
        align-items:center; justify-content:center; padding:28px 18px 40px; }
  .card{ width:100%; max-width:420px; text-align:center; }
  .logo{ width:132px; margin-bottom:6px; }
  .kicker{ font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent);
           margin-bottom:26px; }
  h1{ font-family:'Tenor Sans',serif; font-size:23px; font-weight:400; line-height:1.3;
      margin-bottom:10px; }
  .sub{ color:var(--muted); font-size:13px; margin-bottom:26px; }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:12px;
          padding:22px 20px; text-align:left; }
  .panel + .panel{ margin-top:14px; }

  .btn{ display:block; width:100%; background:var(--accent); color:#fff; border:none;
        border-radius:8px; padding:15px 18px; font-size:12px; letter-spacing:.12em;
        text-transform:uppercase; font-family:'Red Hat Display',sans-serif; font-weight:500;
        cursor:pointer; text-decoration:none; text-align:center; }
  .btn:active{ background:var(--accent2); }
  .btn-ghost{ background:transparent; color:var(--muted); border:1px solid var(--border);
              font-weight:400; }

  ol{ list-style:none; counter-reset:paso; }
  ol li{ counter-increment:paso; display:flex; gap:12px; align-items:flex-start;
         padding:11px 0; border-top:1px solid var(--border); }
  ol li:first-child{ border-top:none; padding-top:0; }
  ol li::before{ content:counter(paso); flex-shrink:0; width:22px; height:22px;
                 border-radius:50%; background:var(--accent); color:#fff; font-size:11px;
                 display:flex; align-items:center; justify-content:center; margin-top:1px; }
  .ico{ display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px;
        border:1px solid var(--border); border-radius:5px; background:var(--bg);
        color:var(--accent); font-size:13px; vertical-align:-6px; margin:0 2px; }

  .qr{ width:214px; height:214px; display:block; margin:2px auto 14px; border-radius:8px; }
  .link{ font-size:12px; color:var(--accent); word-break:break-all; text-decoration:none; }
  .nota{ font-size:11px; color:var(--muted); margin-top:14px; }
  .panel-title{ font-size:10px; letter-spacing:.14em; text-transform:uppercase;
                color:var(--muted); margin-bottom:14px; }
  .ok{ font-family:'Tenor Sans',serif; font-size:17px; margin-bottom:14px; }
  .pie{ margin-top:22px; font-size:12px; }
  .pie a{ color:var(--muted); }
</style>
</head>
<body>

<div class="card">
  <img src="logo-kaya.png" alt="Kaya" class="logo">
  <div class="kicker">Dashboard</div>

  <h1>Tené el tablero como app</h1>
  <div class="sub">Queda en la pantalla de inicio del celular y abre directo, sin buscar el link.</div>

  <div id="zona"></div>

  <div class="pie"><a href="./">Entrar al tablero sin instalar &rsaquo;</a></div>
</div>

<script>
// El link de instalacion y el del tablero son el mismo sitio: esta pagina solo
// guia la instalacion segun el telefono desde el que se abra.
const UA = navigator.userAgent;
const esIOS = /iphone|ipad|ipod/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
const esAndroid = /android/i.test(UA);
// En iPhone solo Safari puede agregar a la pantalla de inicio.
const esSafari = esIOS && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(UA);
const yaInstalada = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

const zona = document.getElementById('zona');
let promptInstalacion = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  promptInstalacion = e;
  pintar();
});
window.addEventListener('appinstalled', () => { promptInstalacion = null; pintar('instalada'); });

function pintar(forzar){
  if(forzar === 'instalada' || yaInstalada){
    zona.innerHTML = `<div class="panel" style="text-align:center;">
      <div class="ok">Ya está instalada ✓</div>
      <div class="sub" style="margin-bottom:18px;">Buscá el ícono de Kaya en la pantalla de inicio.</div>
      <a class="btn" href="./">Abrir el tablero</a>
    </div>`;
    return;
  }

  if(promptInstalacion){
    zona.innerHTML = `<div class="panel" style="text-align:center;">
      <div class="panel-title" style="text-align:center;">Un solo toque</div>
      <button class="btn" onclick="instalar()">Instalar la app</button>
      <div class="nota">Se agrega el ícono de Kaya a tu pantalla de inicio. Ocupa muy poco.</div>
    </div>`;
    return;
  }

  if(esIOS){
    zona.innerHTML = `<div class="panel">
      <div class="panel-title">Desde iPhone o iPad</div>
      <ol>
        <li><span>Tocá <span class="ico">&#8679;</span> <b>Compartir</b>, abajo en el centro de la pantalla.</span></li>
        <li><span>Deslizá y elegí <b>Agregar a inicio</b>.</span></li>
        <li><span>Tocá <b>Agregar</b>. Listo: el ícono de Kaya queda en la pantalla.</span></li>
      </ol>
      ${esSafari ? '' : '<div class="nota" style="color:var(--accent2);">Ojo: en iPhone esto solo funciona con <b>Safari</b>. Copiá el link y abrilo ahí.</div>'}
    </div>
    ${esSafari ? '' : '<div class="panel" style="text-align:center;"><button class="btn btn-ghost" onclick="copiar(this)">Copiar el link</button></div>'}`;
    return;
  }

  if(esAndroid){
    zona.innerHTML = `<div class="panel">
      <div class="panel-title">Desde Android</div>
      <ol>
        <li><span>Tocá el menú <span class="ico">&#8942;</span> arriba a la derecha del navegador.</span></li>
        <li><span>Elegí <b>Instalar app</b> (o <b>Agregar a pantalla principal</b>).</span></li>
        <li><span>Confirmá. El ícono de Kaya queda en la pantalla de inicio.</span></li>
      </ol>
      <div class="nota">Si no aparece la opción, abrí este link con <b>Chrome</b>.</div>
    </div>`;
    return;
  }

  // Computadora: la app se instala en el celular, asi que va el QR.
  zona.innerHTML = `<div class="panel" style="text-align:center;">
    <div class="panel-title" style="text-align:center;">Escaneá con la cámara del celular</div>
    <img class="qr" src="qr-instalar.png" alt="Código QR para instalar el dashboard de Kaya">
    <a class="link" href="https://kaya-dashboard.vercel.app/instalar">kaya-dashboard.vercel.app/instalar</a>
    <div class="nota">La app se instala en el celular. Desde la computadora entrás al tablero como siempre.</div>
  </div>
  <div class="panel" style="text-align:center;"><button class="btn btn-ghost" onclick="copiar(this)">Copiar el link para mandarlo</button></div>`;
}

async function instalar(){
  if(!promptInstalacion) return;
  promptInstalacion.prompt();
  const r = await promptInstalacion.userChoice;
  promptInstalacion = null;
  if(r && r.outcome === 'accepted') pintar('instalada'); else pintar();
}

function copiar(btn){
  const url = 'https://kaya-dashboard.vercel.app/instalar';
  const listo = () => { btn.textContent = 'Link copiado ✓'; setTimeout(()=>btn.textContent='Copiar el link para mandarlo', 2200); };
  if(navigator.clipboard) navigator.clipboard.writeText(url).then(listo).catch(()=>prompt('Copiá el link:', url));
  else prompt('Copiá el link:', url);
}

// El service worker es lo que hace instalable la app; hay que registrarlo tambien aca.
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

pintar();
</script>
</body>
</html>
