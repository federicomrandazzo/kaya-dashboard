<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaya · Dashboard CFO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #c8f05a;
    --accent2: #f0c85a;
    --accent3: #f05a7a;
    --text: #f0ece4;
    --muted: #7a7570;
    --white: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    min-height: 100vh;
    display: flex;
  }

  /* SIDEBAR */
  #sidebar {
    width: 220px;
    min-height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 10;
  }

  .sidebar-logo {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-logo h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    letter-spacing: 0.04em;
    color: var(--text);
  }

  .sidebar-logo span {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    display: block;
    margin-top: 4px;
  }

  .sidebar-nav {
    padding: 16px 12px;
    flex: 1;
  }

  .nav-section-label {
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 12px;
    margin-bottom: 8px;
    margin-top: 16px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.15s;
    letter-spacing: 0.04em;
    font-size: 12px;
  }

  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--accent); color: #0e0e0e; font-weight: 500; }

  .nav-icon { font-size: 14px; width: 18px; text-align: center; }

  .sidebar-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--muted);
  }

  /* MAIN */
  #main {
    margin-left: 220px;
    flex: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #topbar {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 5;
  }

  #topbar h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    font-weight: 400;
  }

  #refresh-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    transition: all 0.15s;
  }
  #refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

  #content {
    padding: 32px;
    flex: 1;
  }

  /* LOADING */
  #loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 300px;
    gap: 16px;
    color: var(--muted);
  }

  .spinner {
    width: 28px; height: 28px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }

  .tab {
    padding: 10px 20px;
    cursor: pointer;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s;
  }

  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* SECTION HEADER */
  .section-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 20px;
  }

  .section-title {
    font-family: 'DM Serif Display', serif;
    font-size: 16px;
    font-weight: 400;
  }

  .section-count {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  /* SUB-SECTION */
  .subsection {
    margin-bottom: 36px;
  }

  .subsection-label {
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  /* TABLE */
  .data-table {
    width: 100%;
    border-collapse: collapse;
  }

  .data-table th {
    text-align: left;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 12px 10px;
    font-weight: 400;
  }

  .data-table td {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    vertical-align: middle;
  }

  .data-table tr:hover td { background: var(--surface2); }

  .sku-badge {
    font-size: 10px;
    color: var(--muted);
    background: var(--surface2);
    padding: 2px 7px;
    border-radius: 3px;
    letter-spacing: 0.06em;
  }

  .stock-num {
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }

  .stock-ok { color: var(--accent); }
  .stock-low { color: var(--accent2); }
  .stock-zero { color: var(--accent3); }

  /* PILL */
  .pill {
    display: inline-block;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 3px;
    font-weight: 500;
  }

  .pill-negra { background: #1e1e1e; color: #c8f05a; border: 1px solid #2a2a2a; }
  .pill-blanca { background: #1e1e1e; color: #f0ece4; border: 1px solid #3a3a3a; }
  .pill-kit { background: #1e1e1e; color: #f0c85a; border: 1px solid #3a2a1a; }

  /* POR ARMAR */
  .armar-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .armar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    transition: border-color 0.15s;
  }

  .armar-card:hover { border-color: #3a3a3a; }

  .armar-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .armar-product-name {
    font-family: 'DM Serif Display', serif;
    font-size: 14px;
    line-height: 1.3;
    flex: 1;
    margin-right: 8px;
  }

  .armar-units {
    font-size: 22px;
    font-weight: 500;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .armar-units-label {
    font-size: 9px;
    color: var(--muted);
    text-align: right;
    margin-top: 2px;
    letter-spacing: 0.08em;
  }

  .armar-limitante {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 11px;
  }

  .armar-limitante-label {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .armar-limitante-item {
    color: var(--accent3);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .armar-limitante-stock {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 10px;
  }

  .armar-ok {
    color: var(--muted);
    font-size: 11px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  /* INSUMOS */
  .insumos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
  }

  .insumo-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
  }

  .insumo-nombre {
    font-size: 11px;
    line-height: 1.4;
    margin-bottom: 6px;
    color: var(--text);
  }

  .insumo-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .insumo-stock {
    font-size: 13px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .insumo-unidad {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .insumo-rubro {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* EMPTY */
  .empty { color: var(--muted); padding: 32px 0; text-align: center; font-size: 12px; }

  /* WELCOME */
  #welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 400px;
    gap: 12px;
    color: var(--muted);
    text-align: center;
  }

  #welcome h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 24px;
    color: var(--text);
    font-weight: 400;
  }

  /* LAST UPDATE */
  .last-update {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>

<nav id="sidebar">
  <div class="sidebar-logo">
    <h1>Kaya®</h1>
    <span>Dashboard CFO</span>
  </div>
  <div class="sidebar-nav">
    <div class="nav-section-label">Módulos</div>
    <div class="nav-item active" onclick="showModule('stock')" id="nav-stock">
      <span class="nav-icon">◈</span> Stock
    </div>
    <div class="nav-item" style="opacity:0.4; cursor:not-allowed;" title="Próximamente">
      <span class="nav-icon">◉</span> Ventas
    </div>
    <div class="nav-item" style="opacity:0.4; cursor:not-allowed;" title="Próximamente">
      <span class="nav-icon">◎</span> Finanzas
    </div>
  </div>
  <div class="sidebar-footer">
    <div id="last-update-sidebar">—</div>
  </div>
</nav>

<div id="main">
  <div id="topbar">
    <h2 id="topbar-title">Stock</h2>
    <div style="display:flex;align-items:center;gap:16px;">
      <span class="last-update" id="last-update-label"></span>
      <button id="refresh-btn" onclick="loadData()">↺ Actualizar</button>
    </div>
  </div>

  <div id="content">
    <div id="loading">
      <div class="spinner"></div>
      <span>Cargando datos desde Google Sheets…</span>
    </div>
    <div id="module-stock" style="display:none;"></div>
    <div id="welcome" style="display:none;">
      <h3>Seleccioná un módulo</h3>
      <span>Usá el panel izquierdo para navegar.</span>
    </div>
  </div>
</div>

<script>
// ── CONFIGURACIÓN ──────────────────────────────────────────────
const SHEET_ID = '1Xznw8YLDR76F79Ie0pww7C2poaLSQ4AxVmIwvQvxbWQ';
const PROXY = 'https://corsproxy.io/?url=';
const URLS = {
  dux:       `${PROXY}${encodeURIComponent(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`)}`,
  tn:        `${PROXY}${encodeURIComponent(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=1712196055`)}`,
  compuestos:`${PROXY}${encodeURIComponent(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=258669797`)}`,
};

// Mapa de SKUs TN → DUX (discrepancias conocidas)
const SKU_MAP = {
  'FUN-TRE':     'TIN-TREM',
  'FUN-TRE100':  'TIN-TREM100',
  'FUN-CDP-100': 'FUN - CDP100',
  'FUN-COR-100': 'FUN-COR100',
  'FUN-MDL-100': 'FUN-MDL100',
  'FUN-REI-100': 'FUN-REI100',
  'FUN-SHI-100': 'FUN-SHI100',
  'TIN-ASH-100': 'TIN-ASH100',
  'TIN-GIN-100': 'TIN-GIN100',
  'TIN-GIN-100': 'TIN-GIN100',
  'JOJ60':       'JOJ-60',
  'JOJ125':      'JOJ-125',
};

// Adaptógenos (PRODUCTO LIQUIDO a granel)
const ADAPTOGENOS = ['MELENA','CORDYCEPS','REISHI','SHIITAKE','PAVO','ASHWAGANDHA','GINSENG','TREM'];

// Distribución por armar (en litros → unidades)
const DIST_ADAPTO = [ { ml: 50, pct: 0.65 }, { ml: 100, pct: 0.35 } ];
const DIST_JOJOBA = [ { ml: 30, pct: 0.38 }, { ml: 60, pct: 0.36 }, { ml: 125, pct: 0.26 } ];

// Mapa de código DUX para adaptógeno → SKU del producto terminado 50/100ml
const ADAPTO_SKU_MAP = {
  'MELENA':      { 50: 'FUN-MDL',   100: 'FUN-MDL100' },
  'CORDYCEPS':   { 50: 'FUN-COR',   100: 'FUN-COR100' },
  'REISHI':      { 50: 'FUN-REI',   100: 'FUN-REI100' },
  'SHIITAKE':    { 50: 'FUN-SHI',   100: 'FUN-SHI100' },
  'PAVO':        { 50: 'FUN-CDP',   100: 'FUN - CDP100' },
  'ASHWAGANDHA': { 50: 'TIN-ASH',   100: 'TIN-ASH100' },
  'GINSENG':     { 50: 'TIN-GIN',   100: 'TIN-GIN100' },
  'TREM':        { 50: 'TIN-TREM',  100: 'TIN-TREM100' },
};

const JOJOBA_SKU_MAP = { 30: 'JOJ-30G', 60: 'JOJ-60', 125: 'JOJ-125' };
const MOSQUETA_SKU = 'ROS-MOS';

// ── ESTADO GLOBAL ──────────────────────────────────────────────
let DATA = { dux: [], tn: [], compuestos: [] };
let currentModule = 'stock';
let currentTab = 'venta';

// ── CSV PARSER ─────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.split('\n');
  const headers = splitCSVLine(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const vals = splitCSVLine(line);
    const obj = {};
    headers.forEach((h, idx) => { obj[h.trim()] = (vals[idx] || '').trim(); });
    rows.push(obj);
  }
  return rows;
}

function splitCSVLine(line) {
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
    else { cur += c; }
  }
  result.push(cur);
  return result;
}

function num(v) {
  if (v === undefined || v === null || v === '') return 0;
  const s = String(v).replace(/\./g, '').replace(',', '.').replace(/[^\d.\-]/g, '');
  return parseFloat(s) || 0;
}

// ── FETCH DATA ─────────────────────────────────────────────────
async function loadData() {
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('module-stock').style.display = 'none';
  document.getElementById('welcome').style.display = 'none';

  try {
    const [duxText, tnText, compText] = await Promise.all([
      fetch(URLS.dux).then(r => r.text()),
      fetch(URLS.tn).then(r => r.text()),
      fetch(URLS.compuestos).then(r => r.text()),
    ]);

    // DUX: tiene 2 filas de encabezado (título + vacía), la real está en la 3ra
    const duxLines = duxText.split('\n');
    const duxClean = duxLines.slice(2).join('\n');
    DATA.dux = parseCSV(duxClean).filter(r => r['Código Producto'] && r['Código Producto'] !== '-');

    DATA.tn = parseCSV(tnText);

    // Compuestos: 2 filas de encabezado también
    const compLines = compText.split('\n');
    const compClean = compLines.slice(2).join('\n');
    DATA.compuestos = parseCSV(compClean).filter(r => r['Código Compuesto']);

    const now = new Date();
    const label = `Actualizado ${now.toLocaleDateString('es-AR')} ${now.toLocaleTimeString('es-AR', {hour:'2-digit',minute:'2-digit'})}`;
    document.getElementById('last-update-label').textContent = label;
    document.getElementById('last-update-sidebar').textContent = label;

    document.getElementById('loading').style.display = 'none';
    renderCurrentModule();
  } catch (e) {
    document.getElementById('loading').innerHTML = `
      <div style="color:var(--accent3);text-align:center;">
        <div style="font-size:20px;margin-bottom:8px;">✕</div>
        <div>Error al cargar datos.</div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px;">Verificá que el Google Sheets esté publicado.</div>
        <button onclick="loadData()" style="margin-top:16px;background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:4px;cursor:pointer;font-family:'DM Mono',monospace;">Reintentar</button>
      </div>`;
  }
}

// ── MÓDULO ─────────────────────────────────────────────────────
function showModule(mod) {
  currentModule = mod;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-' + mod);
  if (navEl) navEl.classList.add('active');
  document.getElementById('topbar-title').textContent = mod.charAt(0).toUpperCase() + mod.slice(1);
  renderCurrentModule();
}

function renderCurrentModule() {
  if (currentModule === 'stock') renderStock();
}

// ── STOCK MODULE ───────────────────────────────────────────────
function renderStock() {
  const el = document.getElementById('module-stock');
  el.style.display = 'block';

  el.innerHTML = `
    <div class="tabs">
      <div class="tab ${currentTab==='venta'?'active':''}" onclick="switchTab('venta')">A la venta</div>
      <div class="tab ${currentTab==='insumos'?'active':''}" onclick="switchTab('insumos')">Insumos</div>
      <div class="tab ${currentTab==='armar'?'active':''}" onclick="switchTab('armar')">Por armar</div>
    </div>
    <div id="tab-content"></div>
  `;

  renderTab();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  renderTab();
}

function renderTab() {
  const el = document.getElementById('tab-content');
  if (!el) return;
  if (currentTab === 'venta')   el.innerHTML = renderVenta();
  if (currentTab === 'insumos') el.innerHTML = renderInsumos();
  if (currentTab === 'armar')   el.innerHTML = renderArmar();
}

// ── A LA VENTA ─────────────────────────────────────────────────
function renderVenta() {
  const rows = DATA.tn.filter(r => r['Nombre'] && r['Nombre'].trim() !== '');

  // Para cada fila con nombre, buscar variantes (filas sin nombre que siguen)
  const products = [];
  let current = null;
  DATA.tn.forEach(r => {
    if (r['Nombre'] && r['Nombre'].trim()) {
      if (current) products.push(current);
      current = {
        nombre: r['Nombre'].trim(),
        sku: r['SKU'] ? r['SKU'].trim() : '',
        cats: r['Categorías'] ? r['Categorías'].trim() : '',
        variantes: [],
      };
      if (r['SKU'] || r['Stock']) {
        current.variantes.push({ sku: (r['SKU']||'').trim(), stock: num(r['Stock']) });
      }
    } else if (current && r['SKU']) {
      current.variantes.push({ sku: r['SKU'].trim(), stock: num(r['Stock']) });
    }
  });
  if (current) products.push(current);

  // Filtrar sin stock total
  const withStock = products.filter(p => p.variantes.some(v => v.stock > 0) || p.variantes.length === 0);

  const isKit = p => /kit/i.test(p.nombre) || p.variantes.some(v => /kit/i.test(v.sku));
  const isNegra = p => /negra|adaptógeno|adaptogeno/i.test(p.cats) || p.variantes.some(v => /^(FUN-|TIN-)/i.test(v.sku));
  const isBlanca = p => !isKit(p) && !isNegra(p);

  const kits = withStock.filter(isKit);
  const negra = withStock.filter(p => !isKit(p) && isNegra(p));
  const blanca = withStock.filter(p => !isKit(p) && !isNegra(p));

  const renderProductTable = (prods, lineaPill) => {
    if (!prods.length) return '<div class="empty">Sin productos</div>';
    return `<table class="data-table">
      <thead><tr>
        <th>Producto</th>
        <th>SKU</th>
        <th style="text-align:right">Stock</th>
      </tr></thead>
      <tbody>
        ${prods.map(p => {
          const totalStock = p.variantes.reduce((s, v) => s + v.stock, 0);
          const mainSku = p.variantes[0]?.sku || p.sku || '—';
          const hasMulti = p.variantes.length > 1;
          const stockClass = totalStock === 0 ? 'stock-zero' : totalStock < 20 ? 'stock-low' : 'stock-ok';

          if (hasMulti) {
            return `<tr>
              <td>
                <div style="font-size:12px">${p.nombre}</div>
                <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;">
                  ${p.variantes.map(v => `<span style="font-size:10px;color:var(--muted);">${v.sku}: <span class="stock-num ${v.stock===0?'stock-zero':v.stock<20?'stock-low':'stock-ok'}">${v.stock}</span></span>`).join('')}
                </div>
              </td>
              <td><span class="sku-badge">${mainSku}…</span></td>
              <td style="text-align:right"><span class="stock-num ${stockClass}">${totalStock}</span></td>
            </tr>`;
          }

          return `<tr>
            <td>${p.nombre}</td>
            <td><span class="sku-badge">${mainSku}</span></td>
            <td style="text-align:right"><span class="stock-num ${stockClass}">${totalStock}</span></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  };

  return `
    <div class="subsection">
      <div class="subsection-label">Kits · ${kits.length} productos</div>
      ${renderProductTable(kits, 'kit')}
    </div>
    <div class="subsection">
      <div class="subsection-label">Línea Negra · ${negra.length} productos</div>
      ${renderProductTable(negra, 'negra')}
    </div>
    <div class="subsection">
      <div class="subsection-label">Línea Blanca · ${blanca.length} productos</div>
      ${renderProductTable(blanca, 'blanca')}
    </div>
  `;
}

// ── INSUMOS ────────────────────────────────────────────────────
function renderInsumos() {
  // Códigos que están en TN (ya vendidos)
  const tnSkus = new Set();
  DATA.tn.forEach(r => {
    if (r['SKU']) {
      tnSkus.add(r['SKU'].trim());
      // también mapear inverso
      Object.entries(SKU_MAP).forEach(([tn, dux]) => {
        if (r['SKU'].trim() === tn) tnSkus.add(dux);
      });
    }
  });

  const RUBROS_INSUMO = ['ENVASES','CAJAS','PARTE CAJAS','ETIQUETAS','FOLLETOS','STICKERS','ACCESORIOS','PRODUCTO LIQUIDO'];

  const insumos = DATA.dux.filter(r => {
    const rubro = (r['Rubro'] || '').trim().toUpperCase();
    return RUBROS_INSUMO.includes(rubro) && !tnSkus.has(r['Código Producto']);
  });

  const byRubro = {};
  insumos.forEach(r => {
    const rubro = (r['Rubro'] || 'OTRO').trim().toUpperCase();
    if (!byRubro[rubro]) byRubro[rubro] = [];
    byRubro[rubro].push(r);
  });

  const rubroOrder = ['PRODUCTO LIQUIDO','ENVASES','CAJAS','PARTE CAJAS','ETIQUETAS','FOLLETOS','STICKERS','ACCESORIOS','OTRO'];

  return rubroOrder.filter(r => byRubro[r]?.length).map(rubro => {
    const items = byRubro[rubro];
    return `
      <div class="subsection">
        <div class="subsection-label">${rubro} · ${items.length} ítems</div>
        <div class="insumos-grid">
          ${items.map(r => {
            const stock = num(r['Stock Disponible']);
            const unidad = (r['Unidad'] || '').toUpperCase();
            const stockClass = stock === 0 ? 'stock-zero' : stock < 20 && unidad === 'LITROS' ? 'stock-low' : stock < 100 ? 'stock-low' : 'stock-ok';
            return `<div class="insumo-card">
              <div class="insumo-nombre">${r['Producto']}</div>
              <div class="insumo-footer">
                <span class="insumo-stock ${stockClass}">${stock.toLocaleString('es-AR')}</span>
                <span class="insumo-unidad">${unidad}</span>
              </div>
              <div style="margin-top:4px"><span class="sku-badge">${r['Código Producto']}</span></div>
            </div>`;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');
}

// ── POR ARMAR ──────────────────────────────────────────────────
function renderArmar() {
  // Construir mapa de stock DUX por código
  const stockDux = {};
  DATA.dux.forEach(r => {
    stockDux[r['Código Producto'].trim()] = num(r['Stock Disponible']);
  });

  // Construir mapa de recetas por código de producto
  const recetas = {};
  DATA.compuestos.forEach(r => {
    const cod = (r['Código Compuesto'] || '').trim();
    if (!cod || /^KIT/i.test(cod)) return;
    if (!recetas[cod]) recetas[cod] = [];
    recetas[cod].push({
      componente: (r['Código Componente'] || '').trim(),
      nombre: (r['Producto Componente'] || '').trim(),
      cantidad: num(r['Cantidad']),
    });
  });

  // Función: dado un SKU de producto terminado y litros disponibles del granel,
  // calcula cuántas unidades se pueden armar considerando TODOS los insumos
  function calcArmar(sku, litrosGranel, codigoGranel, mlPorUnidad) {
    const receta = recetas[sku];
    if (!receta) return { unidades: 0, limitante: { nombre: 'Receta no encontrada', stock: 0 } };

    let minUnidades = Infinity;
    let limitante = null;

    receta.forEach(comp => {
      let stockDisp;
      // Si el componente es el granel en litros, usamos los litros asignados
      if (comp.componente === codigoGranel) {
        stockDisp = litrosGranel;
      } else {
        stockDisp = stockDux[comp.componente] !== undefined ? stockDux[comp.componente] : 0;
      }
      const posibles = comp.cantidad > 0 ? Math.floor(stockDisp / comp.cantidad) : Infinity;
      if (posibles < minUnidades) {
        minUnidades = posibles;
        limitante = { nombre: comp.nombre, codigo: comp.componente, stock: stockDisp, cantidad: comp.cantidad };
      }
    });

    return {
      unidades: minUnidades === Infinity ? 0 : minUnidades,
      limitante: minUnidades === Infinity ? null : limitante,
    };
  }

  const cards = [];

  // ── Adaptógenos ──
  DATA.dux.filter(r => ADAPTOGENOS.includes(r['Código Producto'].trim())).forEach(r => {
    const cod = r['Código Producto'].trim();
    const totalLitros = num(r['Stock Disponible']);
    const skuMap = ADAPTO_SKU_MAP[cod];
    if (!skuMap) return;

    const nombreAdapto = r['Producto'].trim();

    DIST_ADAPTO.forEach(d => {
      const litrosAsignados = totalLitros * d.pct;
      const sku = skuMap[d.ml];
      const result = calcArmar(sku, litrosAsignados, cod, d.ml / 1000);

      cards.push({
        nombre: `${nombreAdapto} ${d.ml}ml`,
        sku,
        unidades: result.unidades,
        limitante: result.limitante,
        litrosAsignados,
        pct: d.pct,
      });
    });
  });

  // ── Jojoba ──
  const jojobaRow = DATA.dux.find(r => r['Código Producto'].trim() === 'JOJOBA');
  if (jojobaRow) {
    const totalLitros = num(jojobaRow['Stock Disponible']);
    DIST_JOJOBA.forEach(d => {
      const litrosAsignados = totalLitros * d.pct;
      const sku = JOJOBA_SKU_MAP[d.ml];
      const result = calcArmar(sku, litrosAsignados, 'JOJOBA', d.ml / 1000);
      cards.push({
        nombre: `Aceite de Jojoba ${d.ml}ml`,
        sku,
        unidades: result.unidades,
        limitante: result.limitante,
        litrosAsignados,
        pct: d.pct,
      });
    });
  }

  // ── Mosqueta ──
  const mosquetaRow = DATA.dux.find(r => r['Código Producto'].trim() === 'MOSQUETA');
  if (mosquetaRow) {
    const totalLitros = num(mosquetaRow['Stock Disponible']);
    const result = calcArmar(MOSQUETA_SKU, totalLitros, 'MOSQUETA', 0.03);
    cards.push({
      nombre: 'Aceite de Rosa Mosqueta 30ml',
      sku: MOSQUETA_SKU,
      unidades: result.unidades,
      limitante: result.limitante,
      litrosAsignados: totalLitros,
      pct: 1,
    });
  }

  if (!cards.length) return '<div class="empty">Sin datos disponibles</div>';

  return `
    <div class="armar-grid">
      ${cards.map(c => {
        const isLimitado = c.unidades < 50;
        const stockClass = c.unidades === 0 ? 'stock-zero' : c.unidades < 20 ? 'stock-low' : 'stock-ok';

        const limitanteHtml = c.limitante
          ? `<div class="armar-limitante">
              <div class="armar-limitante-label">⚠ Insumo limitante</div>
              <div class="armar-limitante-item">
                <span>${c.limitante.nombre}</span>
                <span class="armar-limitante-stock">${c.limitante.stock.toLocaleString('es-AR')} uds</span>
              </div>
            </div>`
          : `<div class="armar-ok">✓ Sin limitantes</div>`;

        return `<div class="armar-card">
          <div class="armar-card-header">
            <div class="armar-product-name">${c.nombre}</div>
            <div>
              <div class="armar-units ${stockClass}">${c.unidades.toLocaleString('es-AR')}</div>
              <div class="armar-units-label">unidades</div>
            </div>
          </div>
          <div style="font-size:10px;color:var(--muted);">
            ${(c.litrosAsignados).toFixed(2)} L asignados · ${Math.round(c.pct*100)}%
          </div>
          ${limitanteHtml}
        </div>`;
      }).join('')}
    </div>
  `;
}

// ── INIT ───────────────────────────────────────────────────────
loadData();
</script>
</body>
