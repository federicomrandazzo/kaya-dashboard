<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaya · Dashboard CFO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #c8f05a;
    --accent2: #f0c85a;
    --accent3: #f05a7a;
    --text: #f0ece4;
    --muted: #7a7570;
    --white: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    min-height: 100vh;
    display: flex;
  }

  /* SIDEBAR */
  #sidebar {
    width: 220px;
    min-height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 10;
  }

  .sidebar-logo {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-logo h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    letter-spacing: 0.04em;
    color: var(--text);
  }

  .sidebar-logo span {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    display: block;
    margin-top: 4px;
  }

  .sidebar-nav {
    padding: 16px 12px;
    flex: 1;
  }

  .nav-section-label {
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 12px;
    margin-bottom: 8px;
    margin-top: 16px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.15s;
    letter-spacing: 0.04em;
    font-size: 12px;
  }

  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--accent); color: #0e0e0e; font-weight: 500; }

  .nav-icon { font-size: 14px; width: 18px; text-align: center; }

  .sidebar-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--muted);
  }

  /* MAIN */
  #main {
    margin-left: 220px;
    flex: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #topbar {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 5;
  }

  #topbar h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    font-weight: 400;
  }

  #refresh-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    transition: all 0.15s;
  }
  #refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

  #content {
    padding: 32px;
    flex: 1;
  }

  /* LOADING */
  #loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 300px;
    gap: 16px;
    color: var(--muted);
  }

  .spinner {
    width: 28px; height: 28px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }

  .tab {
    padding: 10px 20px;
    cursor: pointer;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s;
  }

  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* SECTION HEADER */
  .section-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 20px;
  }

  .section-title {
    font-family: 'DM Serif Display', serif;
    font-size: 16px;
    font-weight: 400;
  }

  .section-count {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  /* SUB-SECTION */
  .subsection {
    margin-bottom: 36px;
  }

  .subsection-label {
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  /* TABLE */
  .data-table {
    width: 100%;
    border-collapse: collapse;
  }

  .data-table th {
    text-align: left;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 12px 10px;
    font-weight: 400;
  }

  .data-table td {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    vertical-align: middle;
  }

  .data-table tr:hover td { background: var(--surface2); }

  .sku-badge {
    font-size: 10px;
    color: var(--muted);
    background: var(--surface2);
    padding: 2px 7px;
    border-radius: 3px;
    letter-spacing: 0.06em;
  }

  .stock-num {
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }

  .stock-ok { color: var(--accent); }
  .stock-low { color: var(--accent2); }
  .stock-zero { color: var(--accent3); }

  /* PILL */
  .pill {
    display: inline-block;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 3px;
    font-weight: 500;
  }

  .pill-negra { background: #1e1e1e; color: #c8f05a; border: 1px solid #2a2a2a; }
  .pill-blanca { background: #1e1e1e; color: #f0ece4; border: 1px solid #3a3a3a; }
  .pill-kit { background: #1e1e1e; color: #f0c85a; border: 1px solid #3a2a1a; }

  /* POR ARMAR */
  .armar-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .armar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    transition: border-color 0.15s;
  }

  .armar-card:hover { border-color: #3a3a3a; }

  .armar-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .armar-product-name {
    font-family: 'DM Serif Display', serif;
    font-size: 14px;
    line-height: 1.3;
    flex: 1;
    margin-right: 8px;
  }

  .armar-units {
    font-size: 22px;
    font-weight: 500;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .armar-units-label {
    font-size: 9px;
    color: var(--muted);
    text-align: right;
    margin-top: 2px;
    letter-spacing: 0.08em;
  }

  .armar-limitante {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 11px;
  }

  .armar-limitante-label {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .armar-limitante-item {
    color: var(--accent3);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .armar-limitante-stock {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 10px;
  }

  .armar-ok {
    color: var(--muted);
    font-size: 11px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  /* INSUMOS */
  .insumos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
  }

  .insumo-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
  }

  .insumo-nombre {
    font-size: 11px;
    line-height: 1.4;
    margin-bottom: 6px;
    color: var(--text);
  }

  .insumo-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .insumo-stock {
    font-size: 13px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .insumo-unidad {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .insumo-rubro {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* EMPTY */
  .empty { color: var(--muted); padding: 32px 0; text-align: center; font-size: 12px; }

  /* WELCOME */
  #welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 400px;
    gap: 12px;
    color: var(--muted);
    text-align: center;
  }

  #welcome h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 24px;
    color: var(--text);
    font-weight: 400;
  }

  /* LAST UPDATE */
  .last-update {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  /* VENTAS */
  .v-kpi-grid { display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px; }
  .v-kpi { background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px; }
  .v-kpi-label { font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px; }
  .v-kpi-val { font-size:20px;font-weight:500;font-variant-numeric:tabular-nums; }
  .v-kpi-sub { font-size:10px;color:var(--muted);margin-top:3px; }
  .v-kpi-delta-pos { color:var(--accent);font-size:11px; }
  .v-kpi-delta-neg { color:var(--accent3);font-size:11px; }

  .v-section { margin-bottom:32px; }
  .v-section-title { font-family:'DM Serif Display',serif;font-size:15px;font-weight:400;margin-bottom:16px; }

  .v-filters { display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap; }
  .v-filter-label { font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase; }
  .v-select {
    background:var(--surface2);border:1px solid var(--border);color:var(--text);
    padding:6px 10px;border-radius:4px;font-family:'DM Mono',monospace;font-size:11px;
    cursor:pointer;
  }
  .v-select:focus { outline:none;border-color:var(--accent); }

  .v-metric-toggle { display:flex;gap:4px; }
  .v-metric-btn {
    padding:5px 12px;border-radius:4px;font-size:10px;letter-spacing:0.08em;
    text-transform:uppercase;cursor:pointer;border:1px solid var(--border);
    background:transparent;color:var(--muted);font-family:'DM Mono',monospace;transition:all 0.15s;
  }
  .v-metric-btn.active { background:var(--accent);color:#0e0e0e;border-color:var(--accent); }

  .v-chart-wrap { background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:24px; }
  .v-chart-title { font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:16px; }

  .v-bar-chart { display:flex;align-items:flex-end;gap:4px;height:160px;padding-bottom:24px;position:relative; }
  .v-bar-wrap { flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end; }
  .v-bar { width:100%;border-radius:3px 3px 0 0;transition:opacity 0.15s;cursor:default;min-height:2px; }
  .v-bar:hover { opacity:0.8; }
  .v-bar-label { font-size:8px;color:var(--muted);white-space:nowrap;transform:rotate(-45deg);transform-origin:top right;margin-top:4px; }
  .v-bar-val { font-size:8px;color:var(--muted);white-space:nowrap; }

  .v-compare-wrap { display:grid;grid-template-columns:1fr 1fr;gap:4px;height:160px;padding-bottom:24px; }
  .v-compare-group { display:flex;align-items:flex-end;gap:2px;height:100%;justify-content:flex-end;flex-direction:column; }

  .v-rubro-table { width:100%;border-collapse:collapse; }
  .v-rubro-table th { text-align:left;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);padding:0 10px 10px; }
  .v-rubro-table td { padding:9px 10px;border-top:1px solid var(--border);font-size:12px; }
  .v-rubro-table tr:hover td { background:var(--surface2); }
  .v-bar-inline { height:4px;border-radius:2px;background:var(--accent);margin-top:4px; }

  .v-tabs { display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border); }
  .v-tab { padding:8px 16px;cursor:pointer;color:var(--muted);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s; }
  .v-tab:hover { color:var(--text); }
  .v-tab.active { color:var(--accent);border-bottom-color:var(--accent); }

  .v-bom-table { width:100%;border-collapse:collapse; }
  .v-bom-table th { text-align:left;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);padding:0 10px 10px; }
  .v-bom-table td { padding:9px 10px;border-top:1px solid var(--border);font-size:12px; }
  .v-bom-table tr:hover td { background:var(--surface2); }

  /* COLLAPSIBLE TREE */
  .tree-row {
    display:flex; align-items:center; cursor:pointer;
    padding:10px 12px; border-top:1px solid var(--border);
    transition:background 0.12s;
    user-select:none;
  }
  .tree-row:hover { background:var(--surface2); }
  .tree-row.level-0 { background:var(--surface2); font-weight:500; }
  .tree-row.level-1 { padding-left:28px; }
  .tree-row.level-2 { padding-left:48px; font-size:12px; color:var(--muted); }
  .tree-toggle {
    width:16px; height:16px; display:inline-flex; align-items:center; justify-content:center;
    font-size:9px; color:var(--muted); margin-right:8px; flex-shrink:0;
    border:1px solid var(--border); border-radius:3px; transition:transform 0.15s;
  }
  .tree-toggle.open { color:var(--accent); border-color:var(--accent); }
  .tree-label { flex:1; }
  .tree-units { font-variant-numeric:tabular-nums; color:var(--muted); font-size:11px; margin-right:16px; }
  .tree-valor { font-variant-numeric:tabular-nums; font-weight:500; font-size:13px; min-width:110px; text-align:right; }
  .tree-children { overflow:hidden; transition:max-height 0.25s ease; }
  .tree-children.collapsed { max-height:0; }

  /* STICKY KPI BAR (ventas) */
  #v-sticky-kpis {
    position:sticky; top:61px; z-index:4;
    background:var(--bg); border-bottom:1px solid var(--border);
    padding:10px 32px;
    display:none;
    gap:0;
  }
  #v-sticky-kpis.visible { display:flex; }
  .v-sticky-kpi {
    flex:1; padding:0 20px; border-right:1px solid var(--border);
  }
  .v-sticky-kpi:first-child { padding-left:0; }
  .v-sticky-kpi:last-child { border-right:none; }
  .v-sticky-kpi-label { font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-bottom:2px; }
  .v-sticky-kpi-val { font-size:15px; font-weight:500; font-variant-numeric:tabular-nums; }

  /* LINE CHART */
  .linechart-wrap { background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:24px;overflow:hidden; }
  .linechart-svg { width:100%; overflow:visible; }

</style>
</head>
<body>

<nav id="sidebar">
  <div class="sidebar-logo">
    <h1>Kaya®</h1>
    <span>Dashboard CFO</span>
  </div>
  <div class="sidebar-nav">
    <div class="nav-section-label">Módulos</div>
    <div class="nav-item active" onclick="showModule('stock')" id="nav-stock">
      <span class="nav-icon">◈</span> Stock
    </div>
    <div class="nav-item" onclick="showModule('ventas')" id="nav-ventas">
      <span class="nav-icon">◉</span> Ventas
    </div>
    <div class="nav-item" style="opacity:0.4; cursor:not-allowed;" title="Próximamente">
      <span class="nav-icon">◎</span> Finanzas
    </div>
  </div>
  <div class="sidebar-footer">
    <div id="last-update-sidebar">—</div>
  </div>
</nav>

<div id="main">
  <div id="topbar">
    <h2 id="topbar-title">Stock</h2>
    <div style="display:flex;align-items:center;gap:16px;">
      <span class="last-update" id="last-update-label"></span>
      <button id="refresh-btn" onclick="loadData()">↺ Actualizar</button>
    </div>
  </div>

  <div id="v-sticky-kpis">
    <div class="v-sticky-kpi"><div class="v-sticky-kpi-label">Venta</div><div class="v-sticky-kpi-val" id="sk-venta" style="color:var(--accent);">—</div></div>
    <div class="v-sticky-kpi"><div class="v-sticky-kpi-label">Órdenes</div><div class="v-sticky-kpi-val" id="sk-ordenes">—</div></div>
    <div class="v-sticky-kpi"><div class="v-sticky-kpi-label">Unidades</div><div class="v-sticky-kpi-val" id="sk-unidades">—</div></div>
    <div class="v-sticky-kpi"><div class="v-sticky-kpi-label">Ticket prom.</div><div class="v-sticky-kpi-val" id="sk-ticket">—</div></div>
  </div>

  <div id="content">
    <div id="loading">
      <div class="spinner"></div>
      <span>Cargando datos desde Google Sheets…</span>
    </div>
    <div id="module-stock" style="display:none;"></div>
    <div id="module-ventas" style="display:none;"></div>
    <div id="welcome" style="display:none;">
      <h3>Seleccioná un módulo</h3>
      <span>Usá el panel izquierdo para navegar.</span>
    </div>
  </div>
</div>

<script>
// ── CONFIG ─────────────────────────────────────────────────────
const PUB_ID = '2PACX-1vQUYvdo1IOKfZS3NupXy24eIctfNsXLIZ_wfH6671Y7rr0hWesmdAmmTjNj69b1VxjjVe1RLbqGE-7R';
const URLS = {

  ordenes_resumen:`https://docs.google.com/spreadsheets/d/e/${PUB_ID}/pub?gid=889232857&single=true&output=csv`,
};

const SKU_MAP = {
  'FUN-TRE':'TIN-TREM','FUN-TRE100':'TIN-TREM100','FUN-CDP-100':'FUN - CDP100',
  'FUN-COR-100':'FUN-COR100','FUN-MDL-100':'FUN-MDL100','FUN-REI-100':'FUN-REI100',
  'FUN-SHI-100':'FUN-SHI100','TIN-ASH-100':'TIN-ASH100','TIN-GIN-100':'TIN-GIN100',
  'JOJ60':'JOJ-60','JOJ125':'JOJ-125',
};

const ADAPTOGENOS = ['MELENA','CORDYCEPS','REISHI','SHIITAKE','PAVO','ASHWAGANDHA','GINSENG','TREM'];
const DIST_ADAPTO = [{ml:50,pct:0.65},{ml:100,pct:0.35}];
const DIST_JOJOBA = [{ml:30,pct:0.38},{ml:60,pct:0.36},{ml:125,pct:0.26}];
const ADAPTO_SKU_MAP = {
  'MELENA':{50:'FUN-MDL',100:'FUN-MDL100'},'CORDYCEPS':{50:'FUN-COR',100:'FUN-COR100'},
  'REISHI':{50:'FUN-REI',100:'FUN-REI100'},'SHIITAKE':{50:'FUN-SHI',100:'FUN-SHI100'},
  'PAVO':{50:'FUN-CDP',100:'FUN - CDP100'},'ASHWAGANDHA':{50:'TIN-ASH',100:'TIN-ASH100'},
  'GINSENG':{50:'TIN-GIN',100:'TIN-GIN100'},'TREM':{50:'TIN-TREM',100:'TIN-TREM100'},
};
const JOJOBA_SKU_MAP = {30:'JOJ-30G',60:'JOJ-60',125:'JOJ-125'};
const MOSQUETA_SKU = 'ROS-MOS';

let DATA = {dux:[],tn:[],compuestos:[],ventas:[],ordenes:[]};
let CACHE = {ventas:null};

// ── UTILS ───────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.split('\n');
  const headers = splitCSVLine(lines[0]);
  const rows = [];
  for (let i=1;i<lines.length;i++) {
    const line=lines[i].trim();
    if(!line) continue;
    const vals=splitCSVLine(line);
    const obj={};
    headers.forEach((h,idx)=>{obj[h.trim()]=(vals[idx]||'').trim();});
    rows.push(obj);
  }
  return rows;
}
function splitCSVLine(line) {
  const result=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){inQ=!inQ;}
    else if(c===','&&!inQ){result.push(cur);cur='';}
    else{cur+=c;}
  }
  result.push(cur);
  return result;
}
function num(v) {
  if(v===undefined||v===null||v==='') return 0;
  const s=String(v).replace(/\./g,'').replace(',','.').replace(/[^\d.\-]/g,'');
  return parseFloat(s)||0;
}
function pesos(v) {
  return '$'+Math.round(v).toLocaleString('es-AR');
}

// ── FETCH ───────────────────────────────────────────────────────
async function loadData() {
  document.getElementById('loading').style.display='flex';
  document.getElementById('module-stock').style.display='none';
  document.getElementById('module-ventas').style.display='none';
  document.getElementById('welcome').style.display='none';
  try {
    const [duxText,tnText,compText,ventasText,ordenesText]=await Promise.all([
      fetch(URLS.dux).then(r=>r.text()),
      fetch(URLS.tn).then(r=>r.text()),
      fetch(URLS.compuestos).then(r=>r.text()),
      fetch(URLS.ventas_resumen).then(r=>r.text()),
      fetch(URLS.ordenes_resumen).then(r=>r.text()),
    ]);
    const duxLines=duxText.split('\n');
    const duxClean=duxLines.slice(2).join('\n');
    DATA.dux=parseCSV(duxClean).filter(r=>r['Código Producto']&&r['Código Producto']!=='-');
    DATA.tn=parseCSV(tnText);
    const compLines=compText.split('\n');
    const compClean=compLines.slice(2).join('\n');
    DATA.compuestos=parseCSV(compClean).filter(r=>r['Código Compuesto']);
    DATA.ventas=parseCSV(ventasText).filter(r=>r['periodo']&&r['periodo'].trim());
    DATA.ordenes=parseCSV(ordenesText).filter(r=>r['periodo']&&r['periodo'].trim());
    CACHE.ventas=null;
    const now=new Date();
    const label=`Actualizado ${now.toLocaleDateString('es-AR')} ${now.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}`;
    document.getElementById('last-update-label').textContent=label;
    document.getElementById('last-update-sidebar').textContent=label;
    document.getElementById('loading').style.display='none';
    renderCurrentModule();
  } catch(e) {
    document.getElementById('loading').innerHTML=`
      <div style="color:var(--accent3);text-align:center;">
        <div style="font-size:20px;margin-bottom:8px;">✕</div>
        <div>Error al cargar datos.</div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px;">Verificá que el Google Sheets esté publicado.</div>
        <button onclick="loadData()" style="margin-top:16px;background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:4px;cursor:pointer;font-family:'DM Mono',monospace;">Reintentar</button>
      </div>`;
  }
}

// ── STOCK KPIs ──────────────────────────────────────────────────
function calcKPIs() {
  // Mapa precio TN por SKU (promo si existe, sino normal)
  const precioVenta={};
  const precioCosto={};
  DATA.tn.forEach(r=>{
    const sku=(r['SKU']||'').trim();
    if(!sku) return;
    const promo=num(r['Precio promocional']);
    const normal=num(r['Precio']);
    precioVenta[sku]=promo>0?promo:normal;
    // también por SKU mapeado
    Object.entries(SKU_MAP).forEach(([tnSku,duxSku])=>{
      if(sku===tnSku) precioVenta[duxSku]=promo>0?promo:normal;
    });
  });

  // Costo DUX por código
  const costoDux={};
  DATA.dux.forEach(r=>{
    costoDux[(r['Código Producto']||'').trim()]=num(r['Costo']);
  });

  // A la venta: productos TN con stock (no kits)
  const products=buildTNProducts();
  let ventaVenta=0, ventaCosto=0;
  products.filter(p=>!isKit(p)).forEach(p=>{
    p.variantes.forEach(v=>{
      const pv=precioVenta[v.sku]||0;
      const duxSku=SKU_MAP[v.sku]||v.sku;
      const pc=costoDux[duxSku]||0;
      ventaVenta+=v.stock*pv;
      ventaCosto+=v.stock*pc;
    });
  });

  // Insumos costo
  const tnSkus=getTnSkus();
  const RUBROS_INSUMO=['ENVASES','CAJAS','PARTE CAJAS','ETIQUETAS','FOLLETOS','STICKERS','ACCESORIOS','PRODUCTO LIQUIDO'];
  let insumosCosto=0;
  DATA.dux.filter(r=>{
    const rubro=(r['Rubro']||'').trim().toUpperCase();
    return RUBROS_INSUMO.includes(rubro)&&!tnSkus.has(r['Código Producto']);
  }).forEach(r=>{
    insumosCosto+=num(r['Stock Disponible'])*num(r['Costo']);
  });

  // Por armar: valor a precio de venta
  const cards=buildArmarCards();
  let armarVenta=0;
  cards.forEach(c=>{
    const sku=c.sku;
    const pv=precioVenta[sku]||0;
    armarVenta+=c.unidades*pv;
  });

  return {ventaVenta,ventaCosto,insumosCosto,armarVenta};
}

// ── HELPERS COMPARTIDOS ─────────────────────────────────────────
function buildTNProducts() {
  const products=[];
  let current=null;

  // Mapa precio TN por SKU
  const precioMap={};
  DATA.tn.forEach(r=>{
    const sku=(r['SKU']||'').trim();
    if(!sku) return;
    const promo=num(r['Precio promocional']);
    const normal=num(r['Precio']);
    precioMap[sku]=promo>0?promo:normal;
  });

  DATA.tn.forEach(r=>{
    if(r['Nombre']&&r['Nombre'].trim()){
      if(current) products.push(current);
      current={
        nombre:r['Nombre'].trim(),
        sku:(r['SKU']||'').trim(),
        cats:(r['Categorías']||'').trim(),
        variantes:[],
      };
      if(r['SKU']||r['Stock']){
        const sku=(r['SKU']||'').trim();
        current.variantes.push({sku,stock:num(r['Stock']),precio:precioMap[sku]||0});
      }
    } else if(current&&r['SKU']){
      const sku=r['SKU'].trim();
      current.variantes.push({sku,stock:num(r['Stock']),precio:precioMap[sku]||0});
    }
  });
  if(current) products.push(current);
  return products;
}

function isKit(p){return /kit/i.test(p.nombre)||p.variantes.some(v=>/kit/i.test(v.sku));}
function isNegra(p){return /negra|adaptógeno|adaptogeno/i.test(p.cats)||p.variantes.some(v=>/^(FUN-|TIN-)/i.test(v.sku));}
function getTnSkus(){
  const tnSkus=new Set();
  DATA.tn.forEach(r=>{
    if(r['SKU']){
      tnSkus.add(r['SKU'].trim());
      Object.entries(SKU_MAP).forEach(([tn,dux])=>{if(r['SKU'].trim()===tn) tnSkus.add(dux);});
    }
  });
  return tnSkus;
}

const ventaTreeState = {}; // key → bool open
function ventaTreeToggle(key) {
  ventaTreeState[key] = !ventaTreeState[key];
  const childEl = document.getElementById('vtree-'+key);
  const iconEl  = document.getElementById('vtree-icon-'+key);
  if (!childEl) return;
  childEl.classList.toggle('collapsed', !ventaTreeState[key]);
  if (iconEl) { iconEl.textContent = ventaTreeState[key] ? '−' : '+'; iconEl.classList.toggle('open', ventaTreeState[key]); }
}
function ventaTreeOpen(key) { if (ventaTreeState[key] === undefined) ventaTreeState[key] = true; }

function renderVenta() {
  const products=buildTNProducts();
  const costoDux={};
  DATA.dux.forEach(r=>{costoDux[(r['Código Producto']||'').trim()]=num(r['Costo']);});

  const kits=products.filter(isKit);
  const negra=products.filter(p=>!isKit(p)&&isNegra(p));
  const blanca=products.filter(p=>!isKit(p)&&!isNegra(p));

  // Línea Negra: separar 50ml y 100ml por SKU
  const negra50=[], negra100=[];
  negra.forEach(p=>{
    const v50=p.variantes.filter(v=>v.sku.endsWith('50')||(!v.sku.endsWith('100')&&!v.sku.endsWith('125')&&!v.sku.endsWith('30')&&!v.sku.endsWith('60')&&!v.sku.match(/100$/)&&!v.sku.match(/XL$/)));
    const v100=p.variantes.filter(v=>v.sku.endsWith('100')||v.sku.match(/100$/));
    // Si tiene variantes 100ml explícitas, separar
    if(v100.length>0){
      if(v50.length>0||p.variantes.filter(v=>!v.sku.endsWith('100')).length>0){
        negra50.push({...p,variantes:p.variantes.filter(v=>!v.sku.match(/100$/))});
      }
      negra100.push({...p,variantes:v100});
    } else {
      negra50.push(p);
    }
  });

  // Línea Blanca: jojoba vs resto
  const isJojoba=p=>/jojoba/i.test(p.nombre)||p.variantes.some(v=>/^JOJ/i.test(v.sku));
  const blancaJojoba=blanca.filter(isJojoba);
  const blancaResto=blanca.filter(p=>!isJojoba(p));

  function valorizar(prods){
    return prods.reduce((s,p)=>s+p.variantes.reduce((sv,v)=>sv+v.stock*v.precio,0),0);
  }
  function costoProds(prods){
    return prods.reduce((s,p)=>s+p.variantes.reduce((sv,v)=>{
      const duxSku=SKU_MAP[v.sku]||v.sku;
      return sv+v.stock*(costoDux[duxSku]||0);
    },0),0);
  }

  const vNegra50=valorizar(negra50);
  const vNegra100=valorizar(negra100);
  const vBlancaJoj=valorizar(blancaJojoba);
  const vBlancaResto=valorizar(blancaResto);
  const totalSinKits=vNegra50+vNegra100+vBlancaJoj+vBlancaResto;
  const vKits=valorizar(kits);

  // helper: tree section header (level 0)
  function treeL0(key, label, valor, defaultOpen=false) {
    if(ventaTreeState[key]===undefined) ventaTreeState[key]=defaultOpen;
    const open=ventaTreeState[key];
    return `<div class="tree-row level-0" onclick="ventaTreeToggle('${key}')">
      <span class="tree-toggle ${open?'open':''}" id="vtree-icon-${key}">${open?'−':'+'}</span>
      <span class="tree-label">${label}</span>
      <span class="tree-valor" style="color:var(--accent);">${pesos(valor)}</span>
    </div><div class="tree-children ${open?'':'collapsed'}" id="vtree-${key}" style="max-height:${open?'2000px':'0'};">`;
  }
  function treeL1(key, label, valor, unidades, defaultOpen=false) {
    if(ventaTreeState[key]===undefined) ventaTreeState[key]=defaultOpen;
    const open=ventaTreeState[key];
    return `<div class="tree-row level-1" onclick="ventaTreeToggle('${key}');event.stopPropagation()">
      <span class="tree-toggle ${open?'open':''}" id="vtree-icon-${key}">${open?'−':'+'}</span>
      <span class="tree-label">${label}</span>
      <span class="tree-units">${Math.round(unidades)} uds</span>
      <span class="tree-valor">${pesos(valor)}</span>
    </div><div class="tree-children ${open?'':'collapsed'}" id="vtree-${key}" style="max-height:${open?'2000px':'0'};">`;
  }
  function treeClose() { return '</div>'; }

  function productRows(prods) {
    let html='';
    prods.forEach(p=>{
      p.variantes.filter(v=>v.stock>0).forEach(v=>{
        const val=v.stock*v.precio;
        const sc=v.stock===0?'stock-zero':v.stock<20?'stock-low':'stock-ok';
        html+=`<div class="tree-row level-2" style="cursor:default;">
          <span style="width:16px;margin-right:8px;flex-shrink:0;"></span>
          <span class="tree-label">${p.nombre} <span class="sku-badge" style="margin-left:6px;">${v.sku}</span></span>
          <span class="tree-units"><span class="stock-num ${sc}">${v.stock}</span></span>
          <span class="tree-valor" style="font-size:11px;color:var(--muted);">${v.precio>0?pesos(v.precio):'—'}</span>
        </div>`;
      });
    });
    return html;
  }

  function unidades(prods){return prods.reduce((s,p)=>s+p.variantes.reduce((sv,v)=>sv+v.stock,0),0);}

  let html = `<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:24px;">`;
  html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);">
    <span style="font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);">Producto</span>
    <div style="display:flex;gap:8px;align-items:center;">
      <span style="font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);min-width:60px;text-align:right;">Uds</span>
      <span style="font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);min-width:110px;text-align:right;">Valor venta</span>
    </div></div>`;

  // LÍNEA NEGRA
  html += treeL0('negra','Línea Negra',vNegra50+vNegra100,true);
    html += treeL1('negra50','50 ml',vNegra50,unidades(negra50),true);
      html += productRows(negra50);
    html += treeClose();
    html += treeL1('negra100','100 ml',vNegra100,unidades(negra100),true);
      html += productRows(negra100);
    html += treeClose();
  html += treeClose();

  // LÍNEA BLANCA
  html += treeL0('blanca','Línea Blanca',vBlancaJoj+vBlancaResto,true);
    html += treeL1('blancaJoj','Aceite de Jojoba',vBlancaJoj,unidades(blancaJojoba),true);
      html += productRows(blancaJojoba);
    html += treeClose();
    html += treeL1('blancaResto','Resto',vBlancaResto,unidades(blancaResto),true);
      html += productRows(blancaResto);
    html += treeClose();
  html += treeClose();

  // KITS
  html += treeL0('kits','Kits',vKits,false);
    html += productRows(kits);
  html += treeClose();

  html += `</div>`;

  // TOTAL
  html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--accent);border-radius:6px;margin-bottom:8px;">
    <span style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text);">TOTAL A LA VENTA</span>
    <span style="font-size:18px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums;">${pesos(totalSinKits+vKits)}</span>
  </div>`;
  return html;
}

  const insumos=DATA.dux.filter(r=>{
    const rubro=(r['Rubro']||'').trim().toUpperCase();
    return RUBROS_INSUMO.includes(rubro)&&!tnSkus.has(r['Código Producto']);
  });
  const byRubro={};
  insumos.forEach(r=>{
    const rubro=(r['Rubro']||'OTRO').trim().toUpperCase();
    if(!byRubro[rubro]) byRubro[rubro]=[];
    byRubro[rubro].push(r);
  });
  const rubroOrder=['PRODUCTO LIQUIDO','ENVASES','CAJAS','PARTE CAJAS','ETIQUETAS','FOLLETOS','STICKERS','ACCESORIOS','OTRO'];
  let totalCosto=0;

  let html=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:24px;">`;
  html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);">
    <span style="font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);">Rubro / Producto</span>
    <div style="display:flex;gap:8px;align-items:center;">
      <span style="font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);min-width:70px;text-align:right;">Stock</span>
      <span style="font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);min-width:90px;text-align:right;">Costo unit.</span>
      <span style="font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);min-width:110px;text-align:right;">Total costo</span>
    </div></div>`;

  rubroOrder.filter(r=>byRubro[r]?.length).forEach(rubro=>{
    const items=byRubro[rubro];
    const rubroCosto=items.reduce((s,r)=>s+num(r['Stock Disponible'])*num(r['Costo']),0);
    totalCosto+=rubroCosto;
    const key='ins-'+rubro.replace(/\s/g,'-');
    if(insumosTreeState[key]===undefined) insumosTreeState[key]=false;
    const open=insumosTreeState[key];
    html+=`<div class="tree-row level-0" onclick="insumosTreeToggle('${key}')">
      <span class="tree-toggle ${open?'open':''}" id="itree-icon-${key}">${open?'−':'+'}</span>
      <span class="tree-label">${rubro} <span style="color:var(--muted);font-size:10px;font-weight:400;">· ${items.length} ítems</span></span>
      <span class="tree-valor" style="color:var(--accent2);">${pesos(rubroCosto)}</span>
    </div>
    <div class="tree-children ${open?'':'collapsed'}" id="itree-${key}" style="max-height:${open?'2000px':'0'};">`;
    items.forEach(r=>{
      const stock=num(r['Stock Disponible']);
      const costo=num(r['Costo']);
      const total=stock*costo;
      const unidad=(r['Unidad']||'').toUpperCase();
      const sc=stock===0?'stock-zero':stock<20&&unidad==='LITROS'?'stock-low':stock<100?'stock-low':'stock-ok';
      html+=`<div class="tree-row level-1" style="cursor:default;gap:8px;">
        <span style="width:16px;margin-right:8px;flex-shrink:0;"></span>
        <span class="tree-label">${r['Producto']} <span class="sku-badge" style="margin-left:4px;">${r['Código Producto']}</span></span>
        <span style="min-width:70px;text-align:right;font-size:11px;"><span class="stock-num ${sc}">${stock.toLocaleString('es-AR')}</span> <span style="color:var(--muted);font-size:9px;">${unidad}</span></span>
        <span style="min-width:90px;text-align:right;font-size:11px;color:var(--muted);">${costo>0?pesos(costo):'—'}</span>
        <span style="min-width:110px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;">${total>0?pesos(total):'—'}</span>
      </div>`;
    });
    html+=`</div>`;
  });
  html+=`</div>`;
  html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--accent2);border-radius:6px;margin-top:8px;">
    <span style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text);">TOTAL INSUMOS A COSTO</span>
    <span style="font-size:18px;font-weight:500;color:var(--accent2);font-variant-numeric:tabular-nums;">${pesos(totalCosto)}</span>
  </div>`;
  return html;
}

// ── POR ARMAR ───────────────────────────────────────────────────
function buildArmarCards() {
  const stockDux={};
  DATA.dux.forEach(r=>{stockDux[(r['Código Producto']||'').trim()]=num(r['Stock Disponible']);});
  const recetas={};
  DATA.compuestos.forEach(r=>{
    const cod=(r['Código Compuesto']||'').trim();
    if(!cod||/^KIT/i.test(cod)) return;
    if(!recetas[cod]) recetas[cod]=[];
    recetas[cod].push({
      componente:(r['Código Componente']||'').trim(),
      nombre:(r['Producto Componente']||'').trim(),
      cantidad:num(r['Cantidad']),
    });
  });

  function calcArmar(sku,litrosGranel,codigoGranel) {
    const receta=recetas[sku];
    if(!receta) return {unidades:0,limitante:{nombre:'Receta no encontrada',stock:0},detalle:[]};
    let minUnidades=Infinity,limitante=null;
    const detalle=receta.map(comp=>{
      let stockDisp=comp.componente===codigoGranel?litrosGranel:(stockDux[comp.componente]!==undefined?stockDux[comp.componente]:0);
      const posibles=comp.cantidad>0?Math.floor(stockDisp/comp.cantidad):Infinity;
      if(posibles<minUnidades){minUnidades=posibles;limitante={nombre:comp.nombre,codigo:comp.componente,stock:stockDisp,cantidad:comp.cantidad};}
      return {...comp,stockDisp,posibles:posibles===Infinity?9999:posibles};
    });
    return {unidades:minUnidades===Infinity?0:minUnidades,limitante,detalle};
  }

  const cards=[];
  DATA.dux.filter(r=>ADAPTOGENOS.includes((r['Código Producto']||'').trim())).forEach(r=>{
    const cod=r['Código Producto'].trim();
    const totalLitros=num(r['Stock Disponible']);
    const skuMap=ADAPTO_SKU_MAP[cod];
    if(!skuMap) return;
    DIST_ADAPTO.forEach(d=>{
      const litrosAsignados=totalLitros*d.pct;
      const sku=skuMap[d.ml];
      const result=calcArmar(sku,litrosAsignados,cod);
      cards.push({nombre:`${r['Producto'].trim()} ${d.ml}ml`,sku,unidades:result.unidades,limitante:result.limitante,detalle:result.detalle,litrosAsignados,pct:d.pct,grupo:'negra'});
    });
  });
  const jojobaRow=DATA.dux.find(r=>(r['Código Producto']||'').trim()==='JOJOBA');
  if(jojobaRow){
    const totalLitros=num(jojobaRow['Stock Disponible']);
    DIST_JOJOBA.forEach(d=>{
      const litrosAsignados=totalLitros*d.pct;
      const sku=JOJOBA_SKU_MAP[d.ml];
      const result=calcArmar(sku,litrosAsignados,'JOJOBA');
      cards.push({nombre:`Aceite de Jojoba ${d.ml}ml`,sku,unidades:result.unidades,limitante:result.limitante,detalle:result.detalle,litrosAsignados,pct:d.pct,grupo:'blanca'});
    });
  }
  const mosquetaRow=DATA.dux.find(r=>(r['Código Producto']||'').trim()==='MOSQUETA');
  if(mosquetaRow){
    const totalLitros=num(mosquetaRow['Stock Disponible']);
    const result=calcArmar(MOSQUETA_SKU,totalLitros,'MOSQUETA');
    cards.push({nombre:'Aceite de Rosa Mosqueta 30ml',sku:MOSQUETA_SKU,unidades:result.unidades,limitante:result.limitante,detalle:result.detalle,litrosAsignados:totalLitros,pct:1,grupo:'blanca'});
  }
  return cards;
}

// ── POR ARMAR ───────────────────────────────────────────────────
let armarExpanded = false;
function toggleArmarExpand() {
  armarExpanded = !armarExpanded;
  renderTab();
}

function renderArmar() {
  const precioVenta={};
  DATA.tn.forEach(r=>{
    const sku=(r['SKU']||'').trim();
    if(!sku) return;
    const promo=num(r['Precio promocional']);
    const normal=num(r['Precio']);
    precioVenta[sku]=promo>0?promo:normal;
    Object.entries(SKU_MAP).forEach(([tnSku,duxSku])=>{if(sku===tnSku) precioVenta[duxSku]=promo>0?promo:normal;});
  });

  const cards=buildArmarCards();
  if(!cards.length) return '<div class="empty">Sin datos disponibles</div>';

  const negra=cards.filter(c=>c.grupo==='negra');
  const blanca=cards.filter(c=>c.grupo==='blanca');

  let totalArmar=0;
  cards.forEach(c=>{totalArmar+=c.unidades*(precioVenta[c.sku]||0);});
  const totalNegra=negra.reduce((s,c)=>s+c.unidades*(precioVenta[c.sku]||0),0);
  const totalBlanca=blanca.reduce((s,c)=>s+c.unidades*(precioVenta[c.sku]||0),0);

  function renderSummaryRow(c, idx) {
    const pv=precioVenta[c.sku]||0;
    const sc=c.unidades===0?'stock-zero':c.unidades<20?'stock-low':'stock-ok';
    const limText=c.limitante?c.limitante.nombre:'OK';
    return `<div class="tree-row level-1" style="cursor:pointer;" onclick="openModal(${idx})">
      <span style="width:16px;margin-right:8px;flex-shrink:0;"></span>
      <span class="tree-label">${c.nombre} <span class="sku-badge" style="margin-left:6px;">${c.sku}</span></span>
      <span style="font-size:10px;color:${c.limitante?'var(--accent3)':'var(--muted)'};min-width:130px;text-align:right;margin-right:16px;" title="Insumo limitante">⚠ ${limText}</span>
      <span class="tree-units"><span class="stock-num ${sc}">${c.unidades}</span> uds</span>
      <span class="tree-valor">${pv>0?pesos(c.unidades*pv):'—'}</span>
    </div>`;
  }

  function renderCards(group) {
    return `<div class="armar-grid" style="padding:16px;">
      ${group.map((c,i)=>{
        const globalIdx=cards.indexOf(c);
        const pv=precioVenta[c.sku]||0;
        const valorPotencial=c.unidades*pv;
        const sc=c.unidades===0?'stock-zero':c.unidades<20?'stock-low':'stock-ok';
        const limitanteHtml=c.limitante
          ?`<div class="armar-limitante"><div class="armar-limitante-label">⚠ Insumo limitante</div>
             <div class="armar-limitante-item"><span>${c.limitante.nombre}</span>
             <span class="armar-limitante-stock">${c.limitante.stock.toLocaleString('es-AR')} uds</span></div></div>`
          :`<div class="armar-ok">✓ Sin limitantes</div>`;
        return `<div class="armar-card" onclick="openModal(${globalIdx})" style="cursor:pointer;">
          <div class="armar-card-header">
            <div class="armar-product-name">${c.nombre}</div>
            <div>
              <div class="armar-units ${sc}">${c.unidades.toLocaleString('es-AR')}</div>
              <div class="armar-units-label">unidades</div>
            </div>
          </div>
          <div style="font-size:10px;color:var(--muted);margin-bottom:6px;">
            ${c.litrosAsignados.toFixed(2)} L · ${Math.round(c.pct*100)}% del granel
          </div>
          <div style="font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums;margin-bottom:4px;">
            ${pv>0?pesos(valorPotencial)+' potencial':'—'}
          </div>
          ${limitanteHtml}
          <div style="font-size:10px;color:var(--muted);margin-top:8px;letter-spacing:0.06em;">Clic para ver receta →</div>
        </div>`;
      }).join('')}
    </div>`;
  }

  // Build the two-group tree
  let html=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--accent);border-radius:6px;flex:1;margin-right:12px;">
        <span style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text);">TOTAL POTENCIAL POR ARMAR</span>
        <span style="font-size:18px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums;">${pesos(totalArmar)}</span>
      </div>
      <button onclick="toggleArmarExpand()" style="background:transparent;border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:4px;cursor:pointer;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.08em;white-space:nowrap;transition:all 0.15s;" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">
        ${armarExpanded?'↑ Vista resumen':'↓ Vista detalle'}
      </button>
    </div>`;

  if(armarExpanded) {
    // Card grid view grouped
    html+=`<div style="margin-bottom:12px;font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--border);">Línea Negra · ${pesos(totalNegra)}</div>`;
    html+=renderCards(negra);
    html+=`<div style="margin-bottom:12px;margin-top:8px;font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--border);">Línea Blanca · ${pesos(totalBlanca)}</div>`;
    html+=renderCards(blanca);
  } else {
    // Compact tree view
    html+=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;">`;
    // Negra group header
    html+=`<div class="tree-row level-0" style="cursor:default;">
      <span style="width:16px;margin-right:8px;flex-shrink:0;"></span>
      <span class="tree-label">Línea Negra · ${negra.length} productos</span>
      <span style="font-size:10px;color:var(--muted);min-width:130px;text-align:right;margin-right:16px;">insumo limitante</span>
      <span class="tree-units" style="min-width:60px;">uds</span>
      <span class="tree-valor">valor</span>
    </div>`;
    negra.forEach((c,i)=>{ html+=renderSummaryRow(c,cards.indexOf(c)); });

    html+=`<div style="height:1px;background:var(--border);"></div>`;
    html+=`<div class="tree-row level-0" style="cursor:default;">
      <span style="width:16px;margin-right:8px;flex-shrink:0;"></span>
      <span class="tree-label">Línea Blanca · ${blanca.length} productos</span>
      <span class="tree-valor" style="color:var(--muted);font-size:11px;"></span>
    </div>`;
    blanca.forEach((c,i)=>{ html+=renderSummaryRow(c,cards.indexOf(c)); });
    html+=`</div>`;
    html+=`<div style="font-size:10px;color:var(--muted);margin-top:10px;text-align:center;letter-spacing:0.06em;">Clic en cualquier fila para ver receta completa</div>`;
  }

  return html;
}

// ── VENTAS MODULE ───────────────────────────────────────────────
let vMetrica = 'ars';
let vTab = 'general';
let vLinea = 'TODAS';
let vPeriodo1 = '';
let vPeriodo2 = '';
let bomCache = null;

function getSku(r){return (r['sku']||r['SKU']||r['SKU_1']||r['SKU.1']||'').trim();}
function metricaLabel(m){return m==='ars'?'ARS':m==='usd'?'USD':'AXI';}
function metricaCol(m){return m==='ars'?'importe_neto':m==='usd'?'importe_usd':'importe_axi';}
function metricaFormat(m,v){
  if(m==='ars') return '$'+Math.round(v).toLocaleString('es-AR');
  if(m==='usd') return 'U$D '+v.toFixed(0);
  return '$'+Math.round(v).toLocaleString('es-AR')+' (axi)';
}
function getPeriodosOrdenados(){
  const ps=[...new Set(DATA.ventas.map(r=>r['periodo']))].filter(Boolean);
  return ps.sort((a,b)=>{const[ya,ma]=a.split('-').map(Number);const[yb,mb]=b.split('-').map(Number);return ya!==yb?ya-yb:ma-mb;});
}

// Fix: normalize LINEA and RUBRO — trim and uppercase
function getLinea(r){return (r['LINEA']||r['linea']||'').trim().toUpperCase();}
function getRubro(r){return (r['RUBRO']||r['rubro']||'').trim().toUpperCase()||'OTRO';}

function updateStickyKPIs() {
  const sbar = document.getElementById('v-sticky-kpis');
  if(!sbar) return;
  const rows1=ventasPeriodo(vPeriodo1);
  const v1=sumMetrica(rows1,vMetrica);
  const u1=sumUnidades(rows1);
  const ord1=DATA.ordenes.find(r=>r['periodo']===vPeriodo1);
  const orders1=ord1?num(ord1['ordenes']):new Set(rows1.map(r=>r['Número de orden'])).size||1;
  const tck1=orders1>0?v1/orders1:0;
  const sk=document.getElementById('sk-venta');
  const so=document.getElementById('sk-ordenes');
  const su=document.getElementById('sk-unidades');
  const st=document.getElementById('sk-ticket');
  if(sk) sk.textContent=metricaFormat(vMetrica,v1);
  if(so) so.textContent=orders1.toLocaleString('es-AR');
  if(su) su.textContent=Math.round(u1).toLocaleString('es-AR');
  if(st) st.textContent=metricaFormat(vMetrica,tck1);
  sbar.classList.toggle('visible', true);
}

function renderVentasModule(){
  const el=document.getElementById('module-ventas');
  el.style.display='block';
  if(!DATA.ventas||!DATA.ventas.length){
    el.innerHTML='<div class="empty" style="padding:60px 0;">Sin datos de ventas cargados.</div>';return;
  }
  const periodos=getPeriodosOrdenados();
  if(!vPeriodo1) vPeriodo1=periodos[periodos.length-1];
  if(!vPeriodo2) vPeriodo2=periodos.length>1?periodos[periodos.length-2]:'';
  el.innerHTML=`
    <div class="v-filters">
      <span class="v-filter-label">Métrica</span>
      <div class="v-metric-toggle">
        <button class="v-metric-btn ${vMetrica==='ars'?'active':''}" onclick="setMetrica('ars')">ARS</button>
        <button class="v-metric-btn ${vMetrica==='usd'?'active':''}" onclick="setMetrica('usd')">USD</button>
        <button class="v-metric-btn ${vMetrica==='axi'?'active':''}" onclick="setMetrica('axi')">AXI</button>
      </div>
      <span class="v-filter-label" style="margin-left:12px;">Período</span>
      <select class="v-select" onchange="setPeriodo1(this.value)">
        ${periodos.map(p=>`<option value="${p}" ${p===vPeriodo1?'selected':''}>${p}</option>`).join('')}
      </select>
      <span class="v-filter-label">vs</span>
      <select class="v-select" onchange="setPeriodo2(this.value)">
        <option value="">— ninguno —</option>
        ${periodos.map(p=>`<option value="${p}" ${p===vPeriodo2?'selected':''}>${p}</option>`).join('')}
      </select>
    </div>
    <div class="v-tabs">
      <div class="v-tab ${vTab==='general'?'active':''}" onclick="setVTab('general')">General</div>
      <div class="v-tab ${vTab==='linea'?'active':''}" onclick="setVTab('linea')">Por Línea</div>
      <div class="v-tab ${vTab==='consumo_prod'?'active':''}" onclick="setVTab('consumo_prod')">Consumo Productos</div>
      <div class="v-tab ${vTab==='consumo_ins'?'active':''}" onclick="setVTab('consumo_ins')">Consumo Insumos</div>
    </div>
    <div id="v-tab-content"></div>
    <div id="modal-overlay" onclick="closeModal(event)" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;">
      <div id="modal-box" style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:24px;max-width:520px;width:90%;max-height:80vh;overflow-y:auto;">
        <div id="modal-content"></div>
      </div>
    </div>`;
  updateStickyKPIs();
  renderVTab();
}
function setMetrica(m){vMetrica=m;renderVentasModule();}
function setPeriodo1(p){vPeriodo1=p;bomCache=null;updateStickyKPIs();renderVTab();}
function setPeriodo2(p){vPeriodo2=p;renderVTab();}
function setVTab(t){vTab=t;document.querySelectorAll('.v-tab').forEach(x=>x.classList.remove('active'));event.target.classList.add('active');renderVTab();}
function setVLinea(l){vLinea=l;renderVTab();}
function renderVTab(){
  const el=document.getElementById('v-tab-content');
  if(!el) return;
  if(vTab==='general') el.innerHTML=renderVentasGeneral();
  if(vTab==='linea')   el.innerHTML=renderVentasLinea();
  if(vTab==='consumo_prod'){el.innerHTML='<div class="empty" style="padding:40px 0;"><div class="spinner" style="margin:0 auto 16px;"></div><div>Procesando...</div></div>';setTimeout(()=>{el.innerHTML=renderConsumoProductos();},50);}
  if(vTab==='consumo_ins'){el.innerHTML='<div class="empty" style="padding:40px 0;"><div class="spinner" style="margin:0 auto 16px;"></div><div>Procesando...</div></div>';setTimeout(()=>{el.innerHTML=renderConsumoInsumos();},50);}
}
function ventasPeriodo(p){return DATA.ventas.filter(r=>r['periodo']===p);}
function sumMetrica(rows,m){
  const col=metricaCol(m);
  return rows.reduce((s,r)=>s+num(r[col]),0);
}
function sumUnidades(rows){return rows.reduce((s,r)=>s+num(r['qty']),0);}

function renderVentasGeneral(){
  const periodos=getPeriodosOrdenados();
  const col=metricaCol(vMetrica);
  const rows1=ventasPeriodo(vPeriodo1);
  const rows2=vPeriodo2?ventasPeriodo(vPeriodo2):[];
  const v1=sumMetrica(rows1,vMetrica),v2=sumMetrica(rows2,vMetrica);
  const u1=sumUnidades(rows1),u2=sumUnidades(rows2);
  const ord1=DATA.ordenes.find(r=>r['periodo']===vPeriodo1);
  const ord2=DATA.ordenes.find(r=>r['periodo']===vPeriodo2);
  const orders1=ord1?num(ord1['ordenes']):new Set(rows1.map(r=>r['Número de orden'])).size||1;
  const orders2=ord2?num(ord2['ordenes']):new Set(rows2.map(r=>r['Número de orden'])).size||1;
  const tck1=orders1>0?v1/orders1:0,tck2=orders2>0?v2/orders2:0;
  function delta(a,b){if(!b||b===0)return '';const p=((a-b)/b*100).toFixed(1);return `<span class="${p>=0?'v-kpi-delta-pos':'v-kpi-delta-neg'}">${p>=0?'▲':'▼'} ${Math.abs(p)}%</span>`;}

  // ── LINE CHART: one line per year, x-axis = month ──
  // Group all periods by year
  const byYear={};
  periodos.forEach(p=>{
    const[y,m]=p.split('-').map(Number);
    if(!byYear[y]) byYear[y]=Array(12).fill(null);
    byYear[y][m-1]=sumMetrica(ventasPeriodo(p),vMetrica);
  });
  const years=Object.keys(byYear).map(Number).sort();
  const months=['E','F','M','A','M','J','J','A','S','O','N','D'];
  const chartW=700, chartH=160, padL=50, padR=10, padT=10, padB=30;
  const plotW=chartW-padL-padR, plotH=chartH-padT-padB;
  const allVals=Object.values(byYear).flatMap(arr=>arr.filter(v=>v!==null));
  const maxV=Math.max(...allVals,1);
  const yearColors=['#c8f05a','#f0c85a','#f05a7a','#5af0c8','#c85af0'];
  const selectedYear1=vPeriodo1?Number(vPeriodo1.split('-')[0]):null;
  const selectedYear2=vPeriodo2?Number(vPeriodo2.split('-')[0]):null;

  function xOf(monthIdx){ return padL + (monthIdx/(11))*plotW; }
  function yOf(val){ return padT + plotH - (val/maxV)*plotH; }

  let svgLines='', svgDots='', svgLabels='', svgLegend='';

  // Y axis gridlines
  const gridVals=[0,0.25,0.5,0.75,1].map(f=>f*maxV);
  gridVals.forEach(gv=>{
    const y=yOf(gv);
    svgLines+=`<line x1="${padL}" y1="${y}" x2="${chartW-padR}" y2="${y}" stroke="#2a2a2a" stroke-width="1"/>`;
    const label=gv>=1e6?`${(gv/1e6).toFixed(1)}M`:gv>=1e3?`${Math.round(gv/1e3)}k`:`${Math.round(gv)}`;
    svgLabels+=`<text x="${padL-4}" y="${y+4}" text-anchor="end" fill="#7a7570" font-size="9" font-family="DM Mono,monospace">${label}</text>`;
  });
  // X axis months
  months.forEach((m,i)=>{
    const x=xOf(i);
    svgLabels+=`<text x="${x}" y="${chartH-padB+16}" text-anchor="middle" fill="#7a7570" font-size="9" font-family="DM Mono,monospace">${m}</text>`;
  });

  years.forEach((yr,yi)=>{
    const color=yearColors[yi%yearColors.length];
    const opacity=(yr===selectedYear1||yr===selectedYear2)?1:0.35;
    const strokeW=(yr===selectedYear1)?2.5:(yr===selectedYear2)?2:1.5;
    const data=byYear[yr];
    // build path
    const pts=data.map((v,i)=>v!==null?{x:xOf(i),y:yOf(v),v,i}:null).filter(Boolean);
    if(pts.length<1) return;
    let d=`M ${pts[0].x} ${pts[0].y}`;
    for(let k=1;k<pts.length;k++){
      const p0=pts[k-1],p1=pts[k];
      const cpx=(p0.x+p1.x)/2;
      d+=` C ${cpx} ${p0.y} ${cpx} ${p1.y} ${p1.x} ${p1.y}`;
    }
    svgLines+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="${strokeW}" opacity="${opacity}" stroke-linejoin="round"/>`;
    // dots + labels for selected years
    pts.forEach(pt=>{
      svgDots+=`<circle cx="${pt.x}" cy="${pt.y}" r="${yr===selectedYear1||yr===selectedYear2?4:2.5}" fill="${color}" opacity="${opacity}"/>`;
      if(yr===selectedYear1||yr===selectedYear2){
        const label=pt.v>=1e6?`${(pt.v/1e6).toFixed(1)}M`:pt.v>=1e3?`${Math.round(pt.v/1e3)}k`:`${Math.round(pt.v)}`;
        const above=pt.y>padT+20;
        svgLabels+=`<text x="${pt.x}" y="${pt.y+(above?-8:14)}" text-anchor="middle" fill="${color}" font-size="8" font-family="DM Mono,monospace" opacity="${opacity}">${label}</text>`;
      }
    });
    // legend
    svgLegend+=`<rect x="${10+yi*90}" y="2" width="10" height="10" fill="${color}" opacity="${opacity}" rx="2"/>`;
    svgLegend+=`<text x="${24+yi*90}" y="11" fill="${opacity===1?'#f0ece4':'#7a7570'}" font-size="9" font-family="DM Mono,monospace">${yr}</text>`;
  });

  const lineChart=`<div class="linechart-wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div class="v-chart-title" style="margin-bottom:0;">Evolución mensual · ${metricaLabel(vMetrica)} · comparativa por año</div>
    </div>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${chartW} ${chartH+20}" class="linechart-svg" style="max-height:200px;">
      <svg y="0" x="0" width="${chartW}" height="20">${svgLegend}</svg>
      <g transform="translate(0,20)">${svgLines}${svgDots}${svgLabels}</g>
    </svg>
  </div>`;

  // Por rubro with RUBRO fix
  const byRubro={};
  rows1.forEach(r=>{const k=getRubro(r);if(!byRubro[k])byRubro[k]={v:0,u:0};byRubro[k].v+=num(r[col]);byRubro[k].u+=num(r['qty']);});
  const maxR=Math.max(...Object.values(byRubro).map(x=>x.v),1);
  const rubroRows=Object.entries(byRubro).sort((a,b)=>b[1].v-a[1].v).map(([rub,d])=>{
    const pct=(d.v/v1*100).toFixed(1),bw=Math.round(d.v/maxR*100);
    return `<tr><td>${rub}</td><td style="text-align:right;font-variant-numeric:tabular-nums;">${metricaFormat(vMetrica,d.v)}</td><td style="text-align:right;color:var(--muted);">${pct}%</td><td style="text-align:right;color:var(--muted);">${Math.round(d.u)}</td><td style="width:120px;"><div class="v-bar-inline" style="width:${bw}%;"></div></td></tr>`;
  }).join('');

  return `
    <div class="v-kpi-grid">
      <div class="v-kpi"><div class="v-kpi-label">Venta ${metricaLabel(vMetrica)}</div><div class="v-kpi-val" style="color:var(--accent);">${metricaFormat(vMetrica,v1)}</div><div class="v-kpi-sub">${delta(v1,v2)} ${vPeriodo2?'vs '+vPeriodo2:''}</div></div>
      <div class="v-kpi"><div class="v-kpi-label">Órdenes</div><div class="v-kpi-val">${orders1.toLocaleString('es-AR')}</div><div class="v-kpi-sub">${delta(orders1,orders2)} ${vPeriodo2?'vs '+vPeriodo2:''}</div></div>
      <div class="v-kpi"><div class="v-kpi-label">Unidades</div><div class="v-kpi-val">${Math.round(u1).toLocaleString('es-AR')}</div><div class="v-kpi-sub">${delta(u1,u2)} ${vPeriodo2?'vs '+vPeriodo2:''}</div></div>
      <div class="v-kpi"><div class="v-kpi-label">Ticket promedio</div><div class="v-kpi-val">${metricaFormat(vMetrica,tck1)}</div><div class="v-kpi-sub">${delta(tck1,tck2)} ${vPeriodo2?'vs '+vPeriodo2:''}</div></div>
    </div>
    ${lineChart}
    <div class="v-chart-wrap">
      <div class="v-chart-title">Por rubro · ${vPeriodo1}</div>
      <table class="v-rubro-table"><thead><tr><th>Rubro</th><th style="text-align:right">Venta</th><th style="text-align:right">%</th><th style="text-align:right">Uds</th><th></th></tr></thead>
      <tbody>${rubroRows}</tbody></table>
    </div>`;
}

function renderVentasLinea(){
  const col=metricaCol(vMetrica);
  const lineas=['TODAS','BLANCA','NEGRA','KITS'];
  const rows1=ventasPeriodo(vPeriodo1).filter(r=>vLinea==='TODAS'||getLinea(r)===vLinea);
  const rows2=vPeriodo2?ventasPeriodo(vPeriodo2).filter(r=>vLinea==='TODAS'||getLinea(r)===vLinea):[];
  const byRubro1={},byRubro2={};
  rows1.forEach(r=>{const k=getRubro(r);if(!byRubro1[k])byRubro1[k]={v:0,u:0};byRubro1[k].v+=num(r[col]);byRubro1[k].u+=num(r['qty']);});
  rows2.forEach(r=>{const k=getRubro(r);if(!byRubro2[k])byRubro2[k]={v:0,u:0};byRubro2[k].v+=num(r[col]);byRubro2[k].u+=num(r['qty']);});
  const allRubros=[...new Set([...Object.keys(byRubro1),...Object.keys(byRubro2)])].sort((a,b)=>(byRubro1[b]?.v||0)-(byRubro1[a]?.v||0));
  const maxV=Math.max(...allRubros.map(r=>byRubro1[r]?.v||0),1);
  const rowsAll1=ventasPeriodo(vPeriodo1);
  const byLinea={};
  rowsAll1.forEach(r=>{const k=getLinea(r)||'OTRO';if(!byLinea[k])byLinea[k]={v:0,u:0};byLinea[k].v+=num(r[col]);byLinea[k].u+=num(r['qty']);});
  const totalV=sumMetrica(rowsAll1,vMetrica);
  const lineaCards=['BLANCA','NEGRA','KITS'].map(l=>{
    const d=byLinea[l]||{v:0,u:0};const pct=totalV>0?(d.v/totalV*100).toFixed(1):0;
    return `<div class="v-kpi"><div class="v-kpi-label">${l}</div><div class="v-kpi-val" style="font-size:16px;">${metricaFormat(vMetrica,d.v)}</div><div class="v-kpi-sub">${pct}% · ${Math.round(d.u)} uds</div></div>`;
  }).join('');
  const rubroRows=allRubros.map(rub=>{
    const d1=byRubro1[rub]||{v:0,u:0},d2=byRubro2[rub]||{v:0,u:0};
    const bw=Math.round((d1.v/maxV)*100);
    const chg=d2.v>0?((d1.v-d2.v)/d2.v*100).toFixed(1):null;
    const chgHtml=chg!==null?`<span class="${Number(chg)>=0?'v-kpi-delta-pos':'v-kpi-delta-neg'}">${Number(chg)>=0?'▲':'▼'} ${Math.abs(chg)}%</span>`:'—';
    return `<tr><td>${rub}</td><td style="text-align:right;font-variant-numeric:tabular-nums;">${metricaFormat(vMetrica,d1.v)}</td><td style="text-align:right;color:var(--muted);font-size:11px;">${d2.v>0?metricaFormat(vMetrica,d2.v):'—'}</td><td style="text-align:right;">${chgHtml}</td><td style="text-align:right;color:var(--muted);">${Math.round(d1.u)}</td><td style="width:100px;"><div class="v-bar-inline" style="width:${bw}%;"></div></td></tr>`;
  }).join('');
  return `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;">${lineaCards}</div>
    <div class="v-filters"><span class="v-filter-label">Filtrar línea</span><div class="v-metric-toggle">${lineas.map(l=>`<button class="v-metric-btn ${vLinea===l?'active':''}" onclick="setVLinea('${l}')">${l}</button>`).join('')}</div></div>
    <div class="v-chart-wrap">
      <div class="v-chart-title">Por rubro · ${vPeriodo1}${vPeriodo2?' vs '+vPeriodo2:''} · ${vLinea}</div>
      <table class="v-rubro-table"><thead><tr><th>Rubro</th><th style="text-align:right">${vPeriodo1}</th><th style="text-align:right">${vPeriodo2||'—'}</th><th style="text-align:right">Δ</th><th style="text-align:right">Uds</th><th></th></tr></thead>
      <tbody>${rubroRows}</tbody></table>
    </div>`;
}

function buildBOMData() {
  if(bomCache&&bomCache.periodo===vPeriodo1) return bomCache.data;

  const recetas={};
  DATA.compuestos.forEach(r=>{
    const cod=(r['Código Compuesto']||'').trim();
    if(!cod) return;
    if(!recetas[cod]) recetas[cod]=[];
    recetas[cod].push({componente:(r['Código Componente']||'').trim(),cantidad:num(r['Cantidad']),nombre:(r['Producto Componente']||'').trim()});
  });

  const nombreDux={},unidadDux={};
  DATA.dux.forEach(r=>{
    const c=(r['Código Producto']||'').trim();
    nombreDux[c]=r['Producto']||'';
    unidadDux[c]=(r['Unidad']||'UNIDAD').toUpperCase();
  });

  const rows=ventasPeriodo(vPeriodo1);
  const ventasPorSku={};
  rows.forEach(r=>{
    const sku=getSku(r);const qty=num(r['qty']);
    if(!sku) return;
    if(!ventasPorSku[sku]) ventasPorSku[sku]={sku,qty:0,nombre:r['nombre']||'',linea:getLinea(r)};
    ventasPorSku[sku].qty+=qty;
  });

  const consumoProductos={};
  Object.values(ventasPorSku).forEach(item=>{
    const esKit=/^KIT/i.test(item.sku);
    const receta=recetas[item.sku];
    if(esKit&&receta&&receta.length){
      receta.forEach(comp=>{
        if(!consumoProductos[comp.componente]) consumoProductos[comp.componente]={sku:comp.componente,qty:0,nombre:comp.nombre||nombreDux[comp.componente]||comp.componente};
        consumoProductos[comp.componente].qty+=item.qty*comp.cantidad;
      });
    } else {
      if(!consumoProductos[item.sku]) consumoProductos[item.sku]={sku:item.sku,qty:0,nombre:item.nombre||nombreDux[item.sku]||item.sku};
      consumoProductos[item.sku].qty+=item.qty;
    }
  });

  const consumoInsumos={};
  Object.values(consumoProductos).forEach(item=>{
    const receta=recetas[item.sku];
    if(receta&&receta.length){
      receta.forEach(comp=>{
        if(!consumoInsumos[comp.componente]) consumoInsumos[comp.componente]={sku:comp.componente,qty:0,nombre:comp.nombre||nombreDux[comp.componente]||comp.componente};
        consumoInsumos[comp.componente].qty+=item.qty*comp.cantidad;
      });
    } else {
      if(!consumoInsumos[item.sku]) consumoInsumos[item.sku]={sku:item.sku,qty:0,nombre:item.nombre||nombreDux[item.sku]||item.sku};
      consumoInsumos[item.sku].qty+=item.qty;
    }
  });

  const data={consumoProductos,consumoInsumos,unidadDux};
  bomCache={periodo:vPeriodo1,data};
  return data;
}

function renderConsumoTabla(items, unidadDux) {
  const sorted=Object.values(items).filter(x=>x.qty>0.001).sort((a,b)=>b.qty-a.qty);
  if(!sorted.length) return '<div class="empty">Sin datos para este período</div>';
  return `<table class="v-bom-table"><thead><tr>
    <th>Nombre</th><th>SKU</th>
    <th style="text-align:right">Cantidad</th>
    <th style="text-align:right">Unidad</th>
  </tr></thead><tbody>
  ${sorted.map(item=>{
    const unidad=unidadDux[item.sku]||'UNIDAD';
    const qf=item.qty>=1?item.qty.toLocaleString('es-AR',{maximumFractionDigits:2}):item.qty.toFixed(3);
    return `<tr><td>${item.nombre}</td><td><span class="sku-badge">${item.sku}</span></td><td style="text-align:right;font-variant-numeric:tabular-nums;font-weight:500;">${qf}</td><td style="text-align:right;color:var(--muted);font-size:10px;">${unidad}</td></tr>`;
  }).join('')}
  </tbody></table>`;
}

function renderConsumoProductos() {
  const {consumoProductos,unidadDux}=buildBOMData();
  return `
    <div style="font-size:11px;color:var(--muted);margin-bottom:20px;">Período: <strong style="color:var(--text);">${vPeriodo1}</strong> · Kits desagregados a productos</div>
    <div class="v-chart-wrap">
      <div class="v-chart-title">Consumo de productos · ${Object.values(consumoProductos).filter(x=>x.qty>0.001).length} ítems</div>
      ${renderConsumoTabla(consumoProductos,unidadDux)}
    </div>`;
}

function renderConsumoInsumos() {
  const {consumoInsumos,unidadDux}=buildBOMData();
  return `
    <div style="font-size:11px;color:var(--muted);margin-bottom:20px;">Período: <strong style="color:var(--text);">${vPeriodo1}</strong> · Productos desagregados a insumos</div>
    <div class="v-chart-wrap">
      <div class="v-chart-title">Consumo de insumos · ${Object.values(consumoInsumos).filter(x=>x.qty>0.001).length} ítems</div>
      ${renderConsumoTabla(consumoInsumos,unidadDux)}
    </div>`;
}

loadData();
